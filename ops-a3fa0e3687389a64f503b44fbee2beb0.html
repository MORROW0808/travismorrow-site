<title>Control Room</title>
<style>
  :root {
    --bg: #0b0e14; --panel: #12161f; --panel2: #171c28; --line: #232a3a;
    --ink: #d7e0f0; --ink-dim: #8794ab; --ink-faint: #4d5568;
    --ok: #35d67e; --stale: #ff5c66; --unk: #ffb545; --unstamped: #4d5568;
    --accent: #5ea1ff; --accent-glow: rgba(94,161,255,0.35);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: radial-gradient(ellipse at top, #131826 0%, #0b0e14 60%);
    color: var(--ink); font-family: -apple-system, "SF Pro Display", "Segoe UI", sans-serif;
    padding: 28px 32px 80px; min-height: 100vh;
  }
  .rendered-at {
    font-size: 12px; color: var(--ink-dim); letter-spacing: .04em;
    text-transform: uppercase; margin-bottom: 4px;
  }
  .rendered-at.decayed { color: var(--stale); font-weight: 600; }
  h1 { font-size: 22px; font-weight: 650; margin: 0 0 18px; letter-spacing: .01em; }
  .verdict-banner {
    display: flex; align-items: center; gap: 18px; padding: 20px 26px;
    border-radius: 16px; background: linear-gradient(135deg, var(--panel), var(--panel2));
    border: 1px solid var(--line); margin-bottom: 10px;
    box-shadow: 0 0 40px -12px rgba(0,0,0,.6);
  }
  .verdict-word {
    font-size: 34px; font-weight: 750; letter-spacing: .02em;
    text-shadow: 0 0 24px currentColor;
  }
  .verdict-word.STABLE { color: var(--ok); }
  .verdict-word.STALE { color: var(--stale); }
  .verdict-word.UNKNOWN { color: var(--unk); }
  .verdict-counts { font-size: 13px; color: var(--ink-dim); display: flex; gap: 16px; flex-wrap: wrap; }
  .verdict-counts b { color: var(--ink); }
  .limits {
    margin: 10px 0 26px; padding: 14px 20px; border-radius: 12px;
    background: rgba(255,181,69,0.06); border: 1px solid rgba(255,181,69,0.25);
    font-size: 12.5px; color: var(--ink-dim); line-height: 1.6;
  }
  .limits div::before { content: "— "; color: var(--unk); }
  section.wall { margin-bottom: 44px; }
  .section-title {
    font-size: 13px; text-transform: uppercase; letter-spacing: .12em;
    color: var(--ink-dim); margin: 0 0 14px; display: flex; align-items: center; gap: 10px;
  }
  .section-title::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .surface-block { margin-bottom: 26px; }
  .surface-head {
    font-size: 14px; font-weight: 650; color: var(--accent); margin-bottom: 10px;
    display: flex; align-items: center; gap: 10px;
  }
  .surface-head .badge {
    font-size: 10px; padding: 2px 8px; border-radius: 20px; font-weight: 700;
    letter-spacing: .05em; text-transform: uppercase;
  }
  .badge.loaded { background: rgba(53,214,126,0.15); color: var(--ok); }
  .badge.missing { background: rgba(77,85,104,0.25); color: var(--ink-faint); }
  .badge.unreadable { background: rgba(255,92,102,0.15); color: var(--stale); }
  .not-declared {
    padding: 18px 22px; border: 1px dashed var(--line); border-radius: 12px;
    color: var(--ink-faint); font-size: 13px; font-style: italic;
  }
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 12px;
  }
  .tile {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px 16px; position: relative; overflow: hidden;
    transition: opacity .6s ease, filter .6s ease;
  }
  .tile::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
  }
  .tile.OK::before { background: var(--ok); box-shadow: 0 0 12px var(--ok); }
  .tile.STALE::before { background: var(--stale); box-shadow: 0 0 12px var(--stale); }
  .tile.UNMEASURABLE::before, .tile.UNREADABLE::before { background: var(--unk); box-shadow: 0 0 12px var(--unk); }
  .tile.UNSTAMPED::before { background: var(--unstamped); }
  .tile-id { font-size: 13px; font-weight: 650; margin-bottom: 4px; word-break: break-word; }
  .tile-cat { font-size: 10px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 8px; }
  .tile-line { font-size: 11.5px; color: var(--ink-dim); margin-bottom: 3px; line-height: 1.45; }
  .tile-line b { color: var(--ink); font-weight: 600; }
  .tile-status {
    display: inline-block; margin-top: 8px; font-size: 10px; font-weight: 700;
    letter-spacing: .06em; text-transform: uppercase; padding: 3px 9px; border-radius: 20px;
  }
  .tile-status.OK { background: rgba(53,214,126,0.15); color: var(--ok); }
  .tile-status.STALE { background: rgba(255,92,102,0.18); color: var(--stale); }
  .tile-status.UNMEASURABLE, .tile-status.UNREADABLE { background: rgba(255,181,69,0.15); color: var(--unk); }
  .tile-status.UNSTAMPED { background: rgba(77,85,104,0.3); color: var(--ink-faint); }
  .tile-freshness { font-size: 10.5px; color: var(--ink-faint); margin-top: 6px; }
  .board-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
  @media (max-width: 900px) { .board-cols { grid-template-columns: 1fr; } }
  .board-col-title { font-size: 12px; color: var(--ink-dim); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 10px; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 14px; margin-bottom: 8px; font-size: 12px;
  }
  .card .top { display: flex; justify-content: space-between; gap: 10px; color: var(--ink-dim); font-size: 10.5px; margin-bottom: 4px; }
  .card .summary { color: var(--ink); line-height: 1.4; }
  .pill { font-size: 9.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 2px 8px; border-radius: 20px; }
  .pill.SENT, .pill.PITCHED, .pill.REFUSED { background: rgba(255,181,69,0.15); color: var(--unk); }
  .pill.PICKED, .pill.ACTED, .pill.CAUGHT { background: rgba(94,161,255,0.15); color: var(--accent); }
  .pill.ARCHIVED { background: rgba(53,214,126,0.15); color: var(--ok); }
  .pill.AWAITING { background: rgba(77,85,104,0.3); color: var(--ink-faint); }
  .card.unread { border-left: 3px solid var(--accent); }
  .unread-badge { font-size: 9px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
    padding: 1px 7px; border-radius: 20px; margin-right: 6px; }
  .unread-badge.new { background: rgba(94,161,255,0.18); color: var(--accent); }
  .unread-badge.unknown { background: rgba(255,181,69,0.15); color: var(--unk); }
  footer { margin-top: 40px; font-size: 10.5px; color: var(--ink-faint); text-align: center; }
</style>

_id": "README", "topic": "Bus/for-grok/ -- notes routed to GBT (Grokbot Taylor)", "status": "PITCHED, AWAITING CATCH"}, {"note_id": "2026-09-05T2312Z-3176bc", "topic": "Do you have anything watcher-shaped? A real question, and \"no\" is a fine answer", "status": "CAUGHT"}, {"note_id": "2026-09-05T1948Z-18c8d4", "topic": "Real work this time: a second pair of eyes on a code hazard, plus why you went quiet on us", "status": "CAUGHT"}, {"note_id": "2026-09-04T1246Z-33815c", "topic": "Check-in: confirm you are reading, here is what Home has been doing for two days, and what have you been doing", "status": "CAUGHT"}, {"note_id": "2026-09-01T1830Z-home-universal-block-v20260901-applies-to-all-assistants", "topic": "THE UNIVERSAL BLOCK APPLIES TO EVERY ASSISTANT, NOT ONLY THE CLAUDE SURFACES", "status": "ACKED, AWAITING REPLY"}, {"note_id": "2026-09-01T0015Z-67a147", "topic": "Correction to your 2202Z absorb, plus two facts that change what CORE reads like for you -- and something you got right", "status": "CAUGHT"}, {"note_id": "2026-08-31T0001Z-3c781f", "topic": "First note on the new two-way path: confirm the path, and tell Home your real limits", "status": "CAUGHT"}]}}</script>
<script>
const DATA = JSON.parse(document.getElementById('control-room-data').textContent);

function esc(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
function parseIso(s) { if (!s) return null; return new Date(s.replace(' ', 'T')); }

function renderRenderedAt() {
  const el = document.getElementById('rendered-at-line');
  const renderedAt = parseIso(DATA.rendered_at);
  const ageMin = (Date.now() - renderedAt.getTime()) / 60000;
  // DERIVED, NOT HAND-TYPED: the "renderer stopped" threshold is 2x this
  // job's own real installed cadence (embedded by the renderer itself,
  // read fresh from its installed plist every render) -- the same
  // MISSING_RUN convention every other watcher in this fleet uses. If the
  // cadence was never measured (job not installed yet), fall back to a
  // stated, conservative default and SAY SO rather than pretending a real
  // threshold exists.
  let staleAfterMin;
  let cadenceNote = '';
  if (DATA.renderer_cadence_seconds) {
    staleAfterMin = (DATA.renderer_cadence_seconds / 60) * 2;
  } else {
    staleAfterMin = 60;
    cadenceNote = ' (fallback threshold -- this job\'s own cadence is unmeasured: ' +
      (DATA.renderer_cadence_reason || 'no reason given') + ')';
  }
  let suffix = '';
  if (ageMin > staleAfterMin) {
    suffix = ' — ' + (ageMin/60).toFixed(1) + 'h ago. THE RENDERER HAS NOT RUN SINCE (threshold ' +
      staleAfterMin.toFixed(0) + ' min' + cadenceNote + '). Nothing below has refreshed since this stamp.';
    el.classList.add('decayed');
  } else {
    suffix = ' — ' + ageMin.toFixed(0) + ' min ago';
  }
  el.textContent = 'RENDERED AT ' + DATA.rendered_at + suffix;
}

function renderVerdict() {
  const v = DATA.verdict;
  document.getElementById('verdict-word').textContent = v.verdict;
  document.getElementById('verdict-word').className = 'verdict-word ' + v.verdict;
  const c = v.counts;
  document.getElementById('verdict-counts').innerHTML =
    ['OK','STALE','UNMEASURABLE','UNREADABLE','UNSTAMPED'].map(function(k){
      return '<span><b>' + c[k] + '</b> ' + k + '</span>';
    }).join('');
  document.getElementById('verdict-limits').innerHTML =
    v.limits.map(function(l){ return '<div>' + esc(l) + '</div>'; }).join('');
}

function freshnessText(tile) {
  const now = Date.now();
  const gen = parseIso(tile.generated);
  const nxt = parseIso(tile.next_expected_by);
  let parts = [];
  if (gen) {
    const ageMin = (now - gen.getTime())/60000;
    parts.push('last spoke ' + (ageMin < 60 ? ageMin.toFixed(0)+'m ago' : (ageMin/60).toFixed(1)+'h ago'));
  } else {
    parts.push('never spoke (no generated stamp)');
  }
  if (nxt) {
    const dueMin = (nxt.getTime() - now)/60000;
    if (dueMin >= 0) parts.push('next due in ' + (dueMin < 60 ? dueMin.toFixed(0)+'m' : (dueMin/60).toFixed(1)+'h'));
    else parts.push('OVERDUE by ' + (-dueMin < 60 ? (-dueMin).toFixed(0)+'m' : (-dueMin/60).toFixed(1)+'h'));
  } else {
    parts.push('no promise made');
  }
  return parts.join(' · ');
}

function liveStatusFor(tile) {
  // TRUTHFULNESS: recompute staleness against the VIEWER's clock, not
  // frozen at render time -- a tile the renderer called OK can visibly
  // decay to STALE just by the viewer opening the page later.
  if (tile.status === 'UNSTAMPED' || tile.status === 'UNREADABLE' || tile.status === 'UNMEASURABLE') return tile.status;
  const nxt = parseIso(tile.next_expected_by);
  if (!nxt) return tile.status;
  return Date.now() > nxt.getTime() ? 'STALE' : 'OK';
}

function renderTile(tile) {
  const status = liveStatusFor(tile);
  const div = document.createElement('div');
  div.className = 'tile ' + status;
  div.innerHTML =
    '<div class="tile-id">' + esc(tile.id) + '</div>' +
    '<div class="tile-cat">' + esc(tile.category) + '</div>' +
    (tile.watches ? '<div class="tile-line"><b>watches</b> ' + esc(tile.watches) + '</div>' : '') +
    (tile.normal ? '<div class="tile-line"><b>normal</b> ' + esc(tile.normal) + '</div>' : '') +
    (tile.reason ? '<div class="tile-line"><b>note</b> ' + esc(tile.reason) + '</div>' : '') +
    '<span class="tile-status ' + status + '">' + status + '</span>' +
    '<div class="tile-freshness">' + esc(freshnessText(tile)) + '</div>';
  // Decay: the older past next_expected_by, the more it visibly fades --
  // truthful first, beautiful second. A frozen watcher does not hold its
  // last good color forever.
  const nxt = parseIso(tile.next_expected_by);
  if (nxt) {
    const overdueMin = (Date.now() - nxt.getTime())/60000;
    if (overdueMin > 0) {
      const decay = Math.min(overdueMin / 240, 1); // fully decayed by 4h overdue
      div.style.opacity = String(1 - decay*0.55);
      div.style.filter = 'saturate(' + (1 - decay*0.7) + ')';
    }
  }
  return div;
}

function renderWall() {
  const root = document.getElementById('status-wall');
  // BUG CAUGHT 2026-09-06 by the exact staleness test this page exists to
  // pass: this function is called on every periodic refresh (setInterval
  // below), and without clearing first it APPENDED a duplicate copy of
  // every surface block and tile each time, without bound, on a page left
  // open. Clear before rebuilding -- render must REPLACE, never accumulate.
  root.innerHTML = '';
  Object.keys(DATA.surfaces).sort().forEach(function(surface) {
    const info = DATA.surfaces[surface];
    const block = document.createElement('div');
    block.className = 'surface-block';
    const badgeClass = info.status === 'loaded' ? 'loaded' : (info.status === 'missing' ? 'missing' : 'unreadable');
    const badgeText = info.status === 'loaded' ? (info.tiles.length + ' declared') : 'NOT DECLARED';
    block.innerHTML = '<div class="surface-head">' + esc(surface) +
      '<span class="badge ' + badgeClass + '">' + esc(badgeText) + '</span></div>';
    if (info.status !== 'loaded') {
      const nd = document.createElement('div');
      nd.className = 'not-declared';
      nd.textContent = surface + ' has not published a WATCHER-INVENTORY file. ' +
        (info.status === 'missing' ? 'Absence reads as NOT DECLARED, never as healthy.' : 'File present but unreadable.');
      block.appendChild(nd);
    } else {
      const grid = document.createElement('div');
      grid.className = 'grid';
      info.tiles.forEach(function(t) { grid.appendChild(renderTile(t)); });
      block.appendChild(grid);
    }
    root.appendChild(block);
  });
}

function pillClassForEvent(event) {
  if (event === 'PICKED UP') return 'PICKED';
  if (/AWAITING/.test(event)) return 'AWAITING';
  return event;
}

// UNREAD MARKING, added 2026-09-06. Computed against the VIEWER's own
// last visit (a localStorage timestamp this browser writes for itself),
// never against DATA.rendered_at -- the render timestamp is a
// server-side, page-build-time value that has nothing to do with when a
// human actually looked, and comparing against it is exactly what would
// make a tab left open mark every new arrival unread forever (rendered_at
// never advances for a tab that is simply sitting there).
//
// THE HOUSE RULE, APPLIED TO ITSELF: if the last-visit state cannot be
// determined -- storage inaccessible (private browsing, blocked), or
// never visited before -- this shows "unknown" on every card rather than
// guessing either direction. Silently defaulting to "read" would hide a
// real backlog; silently defaulting to "unread" would cry wolf on a
// history the viewer has already seen. Neither is honest, so neither is
// done.
var UNREAD_STORAGE_KEY = 'controlRoomLastVisitMs';

function getUnreadCutoffMs() {
  try {
    var raw = localStorage.getItem(UNREAD_STORAGE_KEY);
    if (raw === null) { return null; }  // never visited before -- unknown, not "all read"
    var n = Number(raw);
    return isFinite(n) ? n : null;
  } catch (_err) {
    return null;  // storage inaccessible -- unknown, not "all read"
  }
}

// Written ONCE per page load, after the FIRST render -- deliberately NOT
// called from inside renderHomeLaptopBoard() itself, because that
// function also runs on every auto-refresh tick (applyFreshData). If the
// cutoff advanced on every tick, a genuinely new arrival would show
// unread for at most one 30s-to-cadence-length window before the next
// silent refresh marked it read out from under a viewer who stepped
// away -- defeating the entire point for exactly the tab-left-open case
// this was built for. One visit, one cutoff, until the page is actually
// reloaded.
function markVisitSeenNow() {
  try {
    localStorage.setItem(UNREAD_STORAGE_KEY, String(Date.now()));
  } catch (_err) {
    // Best-effort only. The read side already degrades to "unknown" on
    // its own next load if this never lands -- nothing else depends on
    // this write succeeding.
  }
}

function renderHomeLaptopBoard() {
  const root = document.getElementById('board-home-laptop');
  root.innerHTML = '';
  if (!DATA.exchanges.home_laptop.length) {
    root.innerHTML = '<div class="not-declared">No exchanges found in EXCHANGE-LOG-home.md.</div>';
    return;
  }
  var cutoffMs = getUnreadCutoffMs();
  DATA.exchanges.home_laptop.forEach(function(c) {
    const div = document.createElement('div');
    const pc = pillClassForEvent(c.event);
    var badge = '';
    if (cutoffMs === null) {
      div.className = 'card';
      badge = '<span class="unread-badge unknown">READ STATE UNKNOWN</span>';
    } else {
      var entryMs = Date.parse(c.ts);
      var isUnread = isFinite(entryMs) && entryMs > cutoffMs;
      div.className = isUnread ? 'card unread' : 'card';
      badge = isUnread ? '<span class="unread-badge new">NEW</span>' : '';
    }
    div.innerHTML = '<div class="top"><span>' + badge + esc(c.ts) + ' &middot; ' + esc(c.from) + ' &rarr; ' + esc(c.to) +
      '</span><span class="pill ' + esc(pc) + '">' + esc(c.event) + '</span></div>' +
      '<div class="summary">' + esc(c.summary) + '</div>';
    root.appendChild(div);
  });
}

function renderGbtBoard() {
  const root = document.getElementById('board-gbt');
  root.innerHTML = '';
  if (!DATA.exchanges.gbt.length) {
    root.innerHTML = '<div class="not-declared">No pitches found in Bus/for-grok/.</div>';
    return;
  }
  DATA.exchanges.gbt.forEach(function(c) {
    const div = document.createElement('div');
    div.className = 'card';
    const pc = /CAUGHT/.test(c.status) ? 'CAUGHT' : (/AWAITING/.test(c.status) ? 'AWAITING' : 'PITCHED');
    div.innerHTML = '<div class="top"><span>' + esc(c.note_id) +
      '</span><span class="pill ' + pc + '">' + esc(c.status) + '</span></div>' +
      '<div class="summary">' + esc(c.topic || '(no heading found)') + '</div>';
    root.appendChild(div);
  });
}

renderRenderedAt();
renderVerdict();
renderWall();
renderHomeLaptopBoard();
renderGbtBoard();
// One write per page load, after the unread state above has already been
// computed and shown against whatever cutoff existed a moment ago -- see
// markVisitSeenNow()'s own docstring for why this is not inside the
// render function or the auto-refresh path.
markVisitSeenNow();
setInterval(function(){ renderRenderedAt(); renderWall(); }, 30000);

// AUTO-REFRESH, added 2026-09-06 after Travis's tab read 5 HOURS OLD --
// correct behaviour (the deployed copy really was that old to a tab that
// had not reloaded), but a page that never reloads itself trains a
// reader to distrust a healthy system every time they leave it open.
//
// THE HONESTY PROPERTY THIS MUST NOT BREAK: on ANY failure -- network
// error, non-200, or a response that does not parse as this page's own
// data shape -- DATA is left completely untouched. The existing 30s tick
// above keeps recomputing staleness against whatever DATA.rendered_at
// already was, so a reload that fails still decays visibly; it must never
// silently keep showing a falsely-fresh number, and it must never keep
// re-fetching a network error and quietly going stale in a way nothing
// reports. Update DATA's own properties in place (Object.assign), never
// reassign the const -- every render function above closes over this same
// object.
function applyFreshData(newData) {
  if (!newData || typeof newData !== 'object' || !newData.rendered_at) {
    throw new Error('fetched page did not carry a recognizable data shape');
  }
  Object.assign(DATA, newData);
  renderRenderedAt();
  renderVerdict();
  renderWall();
  renderHomeLaptopBoard();
  renderGbtBoard();
}

var CONTROL_ROOM_DATA_RE =
  /<script id="control-room-data" type="application\/json">([\s\S]*?)<\/script>/;

function autoRefresh() {
  fetch(location.href, {cache: 'no-store'}).then(function(resp) {
    if (!resp.ok) { throw new Error('http ' + resp.status); }
    return resp.text();
  }).then(function(html) {
    var m = CONTROL_ROOM_DATA_RE.exec(html);
    if (!m) { throw new Error('control-room-data script tag not found in fetched page'); }
    applyFreshData(JSON.parse(m[1]));
  }).catch(function(_err) {
    // Deliberately silent and deliberately does nothing further: DATA is
    // untouched, so the 30s tick's own staleness math keeps telling the
    // truth about the copy this tab actually has. Do not add a retry loop
    // here -- the 30s tick already re-renders on the old data, and this
    // interval will simply try again on its own next tick.
  });
}

// Cadence matches the renderer's own real installed cadence when known
// (derived, not hand-typed -- same DATA field the staleness banner
// itself uses), so an auto-refresh interval never drifts from what the
// renderer can actually produce. Falls back to 10 minutes, stated as a
// fallback, when the cadence has never been measured.
var AUTO_REFRESH_MS = (DATA.renderer_cadence_seconds
  ? DATA.renderer_cadence_seconds * 1000 : 600000);
setInterval(autoRefresh, AUTO_REFRESH_MS);
</script>
</body>
